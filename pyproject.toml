# AKMS public workspace root.
#
# Not installable. This file defines the uv workspace, the contributor and CI
# dependency groups, and the shared pytest configuration for cross-package runs.

[project]
name = "akms-workspace"
version = "0.0.0"
description = "AKMS public workspace root (not installable)"
requires-python = ">=3.12,<3.13"

[tool.uv.workspace]
members = [
    "packages/akms",
    "packages/akms_learn",
    "packages/akms_nodes_gen",
    "packages/akms_failure_memory",
]

[tool.uv.sources]
akms = { workspace = true }
akms-learn = { workspace = true }
akms-nodes-gen = { workspace = true }
akms-failure-memory = { workspace = true }

# Contributor and CI toolchains. Version floors follow the release guide.
[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-asyncio>=0.23",
    "pyright>=1.1",
    "ruff>=0.15",
    "twine>=6",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=0.27",
]

[tool.pytest.ini_options]
# One marker vocabulary for every package. `unit` and `contract` carry no
# credentials and reach no network; `live_provider` and `slow` are excluded
# from the default CI suite.
markers = [
    "unit: fast, isolated tests",
    "contract: public schema, API, CLI, runtime, and plugin contracts",
    "integration: cross-component tests with mocked external services",
    "runtime: embedded first-party runtime tests",
    "external_consumer: tests using core contracts without the embedded runtime",
    "regression: tests for previously observed defects",
    "e2e: installed-package user workflows",
    "slow: intentionally expensive tests excluded from default CI",
    "live_provider: tests requiring credentials or network providers",
]

[tool.ruff]
# Ruff governs Python sources only.
#
# Since 0.16 `ruff format` also rewrites Python fenced in Markdown. That is
# wrong for this repository: `docs/` is authored prose, and
# `packages/akms/src/akms/_bundled/global_nodes/content/` is *generated* from
# `Packages/Nodes_Vault` upstream. Letting the formatter touch either would
# diverge the shipped corpus from its authoring source, and the next
# regeneration would silently revert it.
include = ["*.py", "*.pyi"]
target-version = "py312"

[tool.ruff.lint]
# Selected explicitly rather than inheriting ruff's defaults. The default set
# widens between ruff releases — on 0.16.3 it flags 772 findings here against
# 175 for the documented E/F baseline — so inheriting it makes CI fail on an
# unrelated ruff upgrade. Widening this list is a deliberate change with its
# own cleanup, not something a dependency bump should impose.
select = ["E4", "E7", "E9", "F"]

[tool.pyright]
# Scoped and pinned for the same reason as [tool.ruff.lint] above: an
# unconfigured checker re-litigates its own defaults on every upgrade.
#
# Only shipped source is type-checked. Test modules are excluded deliberately:
# fixtures and `parametrize` pass deliberately heterogeneous values, so pyright
# infers union types like `Path | str | float` at every call site and reports
# them against the real signatures. That was 336 of the 419 findings on the
# first run — noise generated by the tests doing their job, not defects.
#
# `include` is only honoured when pyright is invoked without file arguments,
# so the CI step runs a bare `uv run pyright`. `exclude` is belt-and-braces
# for a local run that does pass paths.
include = ["packages/akms/src", "packages/akms_learn/src", "packages/akms_failure_memory/src", "packages/akms_nodes_gen/src"]
exclude = ["**/tests/**", "**/.venv/**", "**/node_modules", "**/__pycache__"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
