name: Documentation

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "packages/**/src/**"
      - "examples/**"
      - ".github/workflows/docs.yml"
  # Publish only when a version is cut, so the site always matches the latest
  # release on PyPI rather than unreleased work on main.
  push:
    tags: ["v*"]
  # Manual publish, e.g. to re-deploy a release tag after a docs-only fix:
  # run it from main with `tag` set, so this version of the workflow builds
  # that tag's docs.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and publish (e.g. v0.4.0). Empty = the selected branch."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation strictly
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install documentation environment and optional runtime
        run: uv sync --locked --group docs --all-packages --all-extras

      - name: Execute documentation examples
        run: uv run pytest tests/docs_examples -q

      - name: Build site
        run: uv run mkdocs build --strict --site-dir site

      - name: Upload Pages artifact
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy GitHub Pages
    # Tags and manual runs only; never a pre-release tag (vX.Y.ZaN, bN, rcN).
    # A tag deploy needs the github-pages environment to allow `v*` tags
    # (Settings -> Environments -> github-pages -> deployment branches and tags).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.ref_type == 'tag' &&
       !contains(github.ref_name, 'a') &&
       !contains(github.ref_name, 'b') &&
       !contains(github.ref_name, 'rc'))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
