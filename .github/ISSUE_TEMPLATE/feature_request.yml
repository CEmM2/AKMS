name: Feature request
description: Propose an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that AKMS makes hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: false
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - Core graph / projections / evidence
        - CLI
        - Embedded runtime / agents
        - MCP
        - akms-learn
        - akms-nodes-gen
        - akms-failure-memory
        - Documentation
    validations:
      required: true
